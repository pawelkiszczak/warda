name: tests

# Runs only after merges to main; PRs are not gated on CI.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # MLX needs Apple silicon; macos-15 runners are arm64.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Download fastText LID model
        run: uv run --locked python -m pretrain.quality.fetch_lid --variant ftz
      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --locked pytest -q
