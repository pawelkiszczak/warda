name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # MLX needs Apple silicon; macos-15 runners are arm64.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pretrain/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r pretrain/requirements.txt
      - name: Download fastText LID model
        run: |
          mkdir -p pretrain/work/quality/models
          curl -sfL --retry 3 -o pretrain/work/quality/models/lid.176.ftz \
            https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz
      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest pretrain -q
